<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Air engine</title>
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<script>
// Air's audio engine. The visible UI is native (SwiftUI); this page only does microphone capture,
// playback, the WebSocket to Aria's local server and voice previews, and reports every event to the
// app through window.webkit.messageHandlers.air. The app drives it with window.air*() calls.
(() => {
  const cfg = Object.assign({ voice: 'af_heart', persona: '', personality: '', think: false, web: true }, window.airConfig || {});
  let ctx = null, ws = null, mic = null, capture = null, player = null, src = null, live = false;
  let lastLevelPost = 0, micLevel = 0, outLevel = 0, previewAudio = null;
  let micMuted = false, voiceMuted = false;

  const post = (msg) => { try { window.webkit.messageHandlers.air.postMessage(msg); } catch (_) {} };
  const text = (data) => new TextDecoder().decode(data.slice(1));

  function postLevels() {
    const now = performance.now();
    if (now - lastLevelPost < 60) return;        // ~16 updates a second is plenty for the orb
    lastLevelPost = now;
    post({ type: 'levels', mic: micLevel, out: outLevel, bands: bands() });
  }

  // Eight log-spaced frequency bands (about 90 Hz to 8 kHz) of whoever is talking, 0..1, for the orb mesh.
  let micAn = null, outAn = null, fbuf = null;
  function bands() {
    const an = outLevel > micLevel * 1.5 ? outAn : (micMuted ? null : micAn);
    if (!an) return [0, 0, 0, 0, 0, 0, 0, 0];
    if (!fbuf || fbuf.length !== an.frequencyBinCount) fbuf = new Uint8Array(an.frequencyBinCount);
    an.getByteFrequencyData(fbuf);
    const hz = ctx.sampleRate / 2 / fbuf.length, out = [];
    for (let b = 0; b < 8; b++) {
      const lo = Math.max(1, Math.floor(90 * Math.pow(2, b * 0.8) / hz)), hi = Math.max(lo + 1, Math.floor(90 * Math.pow(2, (b + 1) * 0.8) / hz));
      let m = 0;
      for (let i = lo; i < Math.min(hi, fbuf.length); i++) m = Math.max(m, fbuf[i]);
      out.push(Math.max(0, (m - 90) / 165));
    }
    return out;
  }

  async function start() {
    if (live || ws) return;
    post({ type: 'state', state: 'connecting' });
    try {
      if (!ctx) {
        ctx = new AudioContext({ latencyHint: 'interactive' });
        await ctx.audioWorklet.addModule('/static/worklet.js');
      }
      await ctx.resume();
      mic = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (err) {
      post({ type: 'error', message: 'Microphone unavailable: ' + (err && err.message ? err.message : err) });
      post({ type: 'state', state: 'idle' });
      return;
    }
    const q = new URLSearchParams({ voice: cfg.voice || '', persona: cfg.persona || '', personality: cfg.personalityName || '',
      think: cfg.think ? '1' : '0', web: cfg.web === false ? '0' : '1', showThinking: cfg.showThinking ? '1' : '0' });
    ws = new WebSocket(`ws://${location.host}/api/chat?${q}`);
    ws.binaryType = 'arraybuffer';
    ws.onmessage = (ev) => {
      const data = new Uint8Array(ev.data);
      const kind = data[0];
      if (kind === 0) goLive();
      else if (kind === 1) {
        const pcm = new Int16Array(ev.data.slice(1));
        const f = new Float32Array(pcm.length);
        for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
        if (player && !voiceMuted) player.port.postMessage(f.buffer, [f.buffer]);
      }
      else if (kind === 2) post({ type: 'aria', text: text(data) });
      else if (kind === 3) post({ type: 'error', message: text(data) });
      else if (kind === 5) post({ type: 'you', text: text(data) });
      else if (kind === 6) { if (player) player.port.postMessage('reset'); post({ type: 'interrupted' }); }
      else if (kind === 7) post({ type: 'state', state: text(data) });
      else if (kind === 8) post({ type: 'lag', seconds: parseFloat(text(data)) });
      else if (kind === 9) { try { post(Object.assign({ type: 'event' }, JSON.parse(text(data)))); } catch (_) {} }
    };
    ws.onclose = () => stop(true);
    ws.onerror = () => post({ type: 'error', message: 'Lost connection to the model.' });
  }

  function goLive() {
    live = true;
    src = ctx.createMediaStreamSource(mic);
    capture = new AudioWorkletNode(ctx, 'air-capture', { numberOfInputs: 1, numberOfOutputs: 0 });
    capture.port.onmessage = (e) => {
      if (micMuted) { micLevel = 0; postLevels(); return; }   // muted: nothing is sent or transcribed
      micLevel = e.data.level; postLevels();
      if (ws && ws.readyState === 1) {
        const body = new Uint8Array(e.data.pcm);
        const msg = new Uint8Array(body.length + 1); msg[0] = 1; msg.set(body, 1);
        ws.send(msg);
      }
    };
    src.connect(capture);
    micAn = ctx.createAnalyser(); micAn.fftSize = 512; micAn.smoothingTimeConstant = 0.6; src.connect(micAn);
    player = new AudioWorkletNode(ctx, 'air-player', { numberOfInputs: 0, outputChannelCount: [2] });
    player.port.onmessage = (e) => { outLevel = e.data.level; postLevels(); };
    player.connect(ctx.destination);
    outAn = ctx.createAnalyser(); outAn.fftSize = 512; outAn.smoothingTimeConstant = 0.6; player.connect(outAn);
    if (mic) mic.getAudioTracks().forEach((t) => { t.enabled = !micMuted; });
    sendJSON({ type: 'mic_muted', on: micMuted });
    sendJSON({ type: 'voice_muted', on: voiceMuted });
    post({ type: 'state', state: 'live' });
  }

  function stop(fromClose) {
    const wasLive = live;
    live = false;
    if (ws && !fromClose) { try { ws.close(); } catch (_) {} }
    ws = null;
    for (const n of [src, capture, player]) { if (n) { try { n.disconnect(); } catch (_) {} } }
    src = capture = player = null;
    micAn = outAn = null;
    if (mic) { mic.getTracks().forEach((t) => t.stop()); mic = null; }
    micLevel = outLevel = 0; lastLevelPost = 0; postLevels();
    post({ type: 'state', state: wasLive ? 'ended' : 'idle' });
  }

  const sendJSON = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  window.airSetConfig = (c) => { Object.assign(cfg, c || {}); sendJSON({ type: 'show_thinking', on: !!cfg.showThinking }); };
  window.airMuteMic = (on) => {
    micMuted = !!on;
    if (mic) mic.getAudioTracks().forEach((t) => { t.enabled = !micMuted; });
    sendJSON({ type: 'mic_muted', on: micMuted });
  };
  window.airMuteVoice = (on) => {
    voiceMuted = !!on;
    if (voiceMuted && player) player.port.postMessage('reset');
    sendJSON({ type: 'voice_muted', on: voiceMuted });
  };
  window.airStart = () => start();
  window.airStop = () => stop(false);
  window.airEndTurn = () => sendJSON({ type: 'end_turn' });
  window.airInterrupt = () => { if (player) player.port.postMessage('reset'); sendJSON({ type: 'stop_speaking' }); };
  window.airConfirm = (answer) => sendJSON({ type: 'confirm', answer });
  window.airSay = (t) => sendJSON({ type: 'say', text: t });
  window.airPreview = async (voice) => {
    try {
      if (previewAudio) previewAudio.pause();
      previewAudio = new Audio(`/api/preview?voice=${encodeURIComponent(voice)}`);
      previewAudio.onended = () => post({ type: 'preview', voice, playing: false });
      post({ type: 'preview', voice, playing: true });
      await previewAudio.play();
    } catch (_) { post({ type: 'preview', voice, playing: false }); }
  };
  window.airStopPreview = () => { if (previewAudio) { previewAudio.pause(); post({ type: 'preview', voice: '', playing: false }); } };
  post({ type: 'ready' });
})();
</script>
</body>
</html>
